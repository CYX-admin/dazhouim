<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮箱验证 - 聊天室</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; color: #333; display: flex; align-items: center; justify-content: center; height: 100vh; }
.card { max-width: 480px; width: 90%; padding: 40px 32px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); text-align: center; }
.card h1 { margin-bottom: 16px; font-size: 22px; color: #e65100; }
.card p { color: #555; margin-bottom: 12px; font-size: 14px; line-height: 1.6; }
.card .email { background: #f5f5f5; padding: 8px 12px; border-radius: 6px; margin: 12px 0; font-size: 14px; word-break: break-all; }
.btn { display: inline-block; padding: 10px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; color: #fff; background: #1a73e8; margin: 6px; }
.btn:hover { background: #1557b0; }
.btn-green { background: #28a745; }
.btn-green:hover { background: #218838; }
.btn-gray { background: #6c757d; }
.btn-gray:hover { background: #5a6268; }
.warn { background: #fff3cd; color: #856404; padding: 12px; border-radius: 6px; margin: 16px 0; font-size: 13px; line-height: 1.6; text-align: left; }
</style>
</head>
<body>
<div class="card">
<h1>账号已停用</h1>
<div class="warn">
<p><strong>您尚未验证邮箱，账号已被停用。</strong></p>
<p>您的账号注册后超过 10 分钟仍未验证邮箱，现已无法使用聊天功能。</p>
<p>请尽快完成邮箱验证，否则账号将在<b>注册满 1 小时</b>后被自动删除。</p>
</div>
{% if email %}
<div class="email">验证邮箱：{{ email }}</div>
{% endif %}
<a class="btn btn-green" href="/account/">前往验证邮箱</a>
<a class="btn btn-gray" href="/logout/">退出登录</a>
</div>
</body>
</html>
